name: kudu
description: "Cross-platform mobile app for Kudu app"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  go_router_builder: ^2.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  
  fonts:
    - family: Proxima
      fonts:
        - asset: assets/fonts/proxima/w300.otf
          weight: 300
        - asset: assets/fonts/proxima/w400.otf
          weight: 400
        - asset: assets/fonts/proxima/w500.otf
          weight: 500
        - asset: assets/fonts/proxima/w600.otf
          weight: 600
        - asset: assets/fonts/proxima/w700.otf
          weight: 700
        - asset: assets/fonts/proxima/w800.otf
          weight: 800
        - asset: assets/fonts/proxima/w900.otf
          weight: 900
