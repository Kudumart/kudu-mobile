name: kudu
description: "Cross-platform mobile app for Kudu app"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.4.1
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.14
  equatable: ^2.0.5
  intl: ^0.19.0
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  delightful_toast: ^1.1.0
  intl_phone_field: ^3.2.0
  tab_indicator_styler: ^2.0.0
  carousel_slider: ^5.0.0
  dotted_border: ^2.1.0
  flutter_markdown: ^0.7.4+1
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  go_router_builder: ^2.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/w300.ttf
          weight: 300
        - asset: assets/fonts/poppins/w400.ttf
          weight: 400
        - asset: assets/fonts/poppins/w500.ttf
          weight: 500
        - asset: assets/fonts/poppins/w600.ttf
          weight: 600
        - asset: assets/fonts/poppins/w700.ttf
          weight: 700
        - asset: assets/fonts/poppins/w800.ttf
          weight: 800
        - asset: assets/fonts/poppins/w900.ttf
          weight: 900
